# Tests, builds and publishes the package to npm when a GitHub release is published.
#
# Publishing uses npm trusted publishing (OIDC), so no npm token is stored in the repo. The
# package's settings on npmjs.com must list this repository and this workflow file
# (npm-publish.yml) as a trusted publisher. npm adds provenance to the published package.
# See https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  release:
    # published, not created: publishing a draft release doesn't fire created
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow through OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/
      # trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10
      - run: npm install -g npm@^11.5.1
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::release tag $TAG doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      # tsc also emits the per-module dist/*.js files, including dist/browser.js, which
      # package.json's "browser" field points to; npm run build alone doesn't make them
      - run: npm run type-check
      - name: Check the package includes every entry point
        run: |
          for f in dist/index.cjs dist/index.esm.js dist/index.d.ts dist/browser.js; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
      - run: npm publish
